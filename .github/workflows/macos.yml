name: macOS app

# Builds nolune.app (macos/) on a Mac, ad-hoc signed, and checks the bundle works: its Node runs
# the CLI, and the launcher's gateway mode, as launchd runs it, starts a gateway that answers.
# The DMG is kept as an artifact for trying the onboarding.

on:
  push:
    paths:
      - 'macos/**'
      - 'packages/cli/src/service.ts'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'macos/**'
      - 'packages/cli/src/service.ts'
      - '.github/workflows/macos.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Build and check nolune.app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The build number is the commit count.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Build the app
        run: macos/scripts/build-app.sh
      - name: Check the app
        run: |
          app=macos/dist/arm64/nolune.app
          export NOLUNE_HOME="$RUNNER_TEMP/nolune-home"
          echo '::group::The bundled Node runs the CLI'
          "$app/Contents/MacOS/node" "$app/Contents/Resources/app/node_modules/nolune/dist/cli.js" setup \
            --name CI --email ci@example.com --password 'Launcher-Check-42' --origin http://localhost:5780
          echo '::endgroup::'
          echo '::group::The launcher starts the gateway'
          "$app/Contents/MacOS/Nolune" --gateway &
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:5780/ && break
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5780/)
          echo "HTTP $code"
          cat "$NOLUNE_HOME/logs/gateway.log"
          kill %1
          wait || true
          [[ "$code" =~ ^(200|30[0-9])$ ]]
          echo '::endgroup::'
          echo '::group::The Full Disk Access check runs'
          if "$app/Contents/MacOS/Nolune" --probe-disk-access; then echo granted; else echo 'not granted'; fi
          echo '::endgroup::'
      - name: Draw the screens
        # Every screen of the onboarding and the menu, as PNGs (Snapshot.swift).
        run: perl -e 'alarm 180; exec @ARGV' macos/dist/arm64/nolune.app/Contents/MacOS/Nolune --snapshot "$RUNNER_TEMP/snapshots"
      - uses: actions/upload-artifact@v4
        with:
          name: nolune-macos-arm64
          path: macos/dist/*.dmg
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: onboarding-screens
          path: ${{ runner.temp }}/snapshots
          retention-days: 14
