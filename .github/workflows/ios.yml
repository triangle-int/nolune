name: iOS app

# Builds nolune for iOS (ios/) and runs its tests on a simulator, builds it for a device as the App
# Store gets it (unsigned: signing is Xcode's, ios/README.md), and keeps two screens as PNGs: the
# first one, and the app with a page open. It builds the macOS app's Sky.swift and Theme.swift too.

on:
  push:
    paths:
      - 'ios/**'
      - 'macos/Sources/Nolune/Sky.swift'
      - 'macos/Sources/Nolune/Theme.swift'
      - 'macos/Resources/Fonts/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'macos/Sources/Nolune/Sky.swift'
      - 'macos/Sources/Nolune/Theme.swift'
      - 'macos/Resources/Fonts/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Build and test nolune for iOS
    runs-on: macos-15
    env:
      BUILD: ${{ github.workspace }}/ios/build
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Pick a simulator
        id: simulator
        run: |
          xcodebuild -version
          # The newest iOS's first iPhone.
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in runtimes if ".iOS-" in r), key=lambda r: [int(n) for n in r.split(".iOS-")[1].split("-")])
          print(next(d["udid"] for d in runtimes[ios[-1]] if d["name"].startswith("iPhone")))
          ')
          xcrun simctl list devices | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # Booted now, it finishes setting itself up while the tests run (they may run on a
          # clone of it), ready for the screens after them.
          xcrun simctl boot "$udid" || true
      # -quiet: only warnings, errors and the tests that fail.
      - name: Test
        run: |
          xcodebuild -quiet test -project ios/Nolune.xcodeproj -scheme Nolune \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$BUILD" CODE_SIGNING_ALLOWED=NO
      - name: Build for a device
        run: |
          xcodebuild -quiet build -project ios/Nolune.xcodeproj -scheme Nolune -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$BUILD" CODE_SIGNING_ALLOWED=NO
      - name: Draw the screens
        continue-on-error: true
        timeout-minutes: 10
        run: |
          udid=${{ steps.simulator.outputs.udid }}
          screens="$RUNNER_TEMP/screens"
          mkdir -p "$screens"
          # Each step of it may take three minutes at most, and says what it's doing, so one
          # that hangs shows which.
          step() { echo "> $*"; perl -e 'alarm shift; exec @ARGV' 180 "$@"; }
          step xcrun simctl bootstatus "$udid" -b
          step xcrun simctl install "$udid" "$BUILD/Build/Products/Debug-iphonesimulator/Nolune.app"
          step xcrun simctl launch "$udid" dev.nolune.app
          sleep 6
          step xcrun simctl io "$udid" screenshot "$screens/connect.png"
          # A page open, as if connected: the launch argument stands in for the saved address.
          step xcrun simctl terminate "$udid" dev.nolune.app
          step xcrun simctl launch "$udid" dev.nolune.app -origin https://www.nolune.dev
          sleep 10
          step xcrun simctl io "$udid" screenshot "$screens/page.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screens
          path: ${{ runner.temp }}/screens
          retention-days: 14
          if-no-files-found: ignore
