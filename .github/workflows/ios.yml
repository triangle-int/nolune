name: iOS app

# Builds nolune for iOS (ios/) and runs its tests on a simulator, builds it for a device as the App
# Store gets it (unsigned: signing is Xcode's, ios/README.md), and keeps its screens as PNGs: the
# first one; the native screens (sign-in, sidebar, chat, new chat, bell and a profile's pages)
# from a pretend nolune (ios/ci/nolune.py); the note an older nolune gets; and today's web app
# (`-native NO`) with a page open. It builds the app's widgets and share extension with it, and
# the macOS app's Sky.swift and Theme.swift.
# The runner's Xcode is 26, with iOS 26's SDK: the app wears its look, Liquid Glass.

on:
  push:
    paths:
      - 'ios/**'
      - 'macos/Sources/Nolune/Sky.swift'
      - 'macos/Sources/Nolune/Theme.swift'
      - 'macos/Resources/Fonts/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'macos/Sources/Nolune/Sky.swift'
      - 'macos/Sources/Nolune/Theme.swift'
      - 'macos/Resources/Fonts/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Build and test nolune for iOS
    runs-on: macos-26
    env:
      BUILD: ${{ github.workspace }}/ios/build
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Pick a simulator
        id: simulator
        run: |
          xcodebuild -version
          # The newest iOS's first iPhone.
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in runtimes if ".iOS-" in r), key=lambda r: [int(n) for n in r.split(".iOS-")[1].split("-")])
          print(next(d["udid"] for d in runtimes[ios[-1]] if d["name"].startswith("iPhone")))
          ')
          xcrun simctl list devices | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # Booted now, it finishes setting itself up while the tests run (they may run on a
          # clone of it), ready for the screens after them.
          xcrun simctl boot "$udid" || true
      # -quiet: only warnings, errors and the tests that fail.
      - name: Test
        run: |
          xcodebuild -quiet test -project ios/Nolune.xcodeproj -scheme Nolune \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$BUILD" CODE_SIGNING_ALLOWED=NO
      - name: Build for a device
        run: |
          xcodebuild -quiet build -project ios/Nolune.xcodeproj -scheme Nolune -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$BUILD" CODE_SIGNING_ALLOWED=NO
      - name: Draw the screens
        continue-on-error: true
        timeout-minutes: 10
        run: |
          udid=${{ steps.simulator.outputs.udid }}
          screens="$RUNNER_TEMP/screens"
          mkdir -p "$screens"
          # Each step of it may take three minutes at most, and says what it's doing, so one
          # that hangs shows which.
          step() { echo "> $*"; perl -e 'alarm shift; exec @ARGV' 180 "$@"; }
          step xcrun simctl bootstatus "$udid" -b
          step xcrun simctl install "$udid" "$BUILD/Build/Products/Debug-iphonesimulator/Nolune.app"
          step xcrun simctl launch "$udid" dev.nolune.app
          sleep 6
          step xcrun simctl io "$udid" screenshot "$screens/connect.png"
          # A pretend nolune, signed out and signed in (the simulator shares this Mac's localhost).
          # It's Apple's python3: the runner's firewall quietly drops connections to Homebrew's.
          /usr/bin/python3 ios/ci/nolune.py 5780 > /dev/null 2>&1 &
          /usr/bin/python3 ios/ci/nolune.py 5781 signed-in > "$screens/nolune.log" 2>&1 &
          # It takes a while to start the first time.
          for port in 5780 5781; do
            for _ in $(seq 30); do curl -fsS -m 2 "http://localhost:$port/api/version" 2> /dev/null && break; sleep 1; done
          done
          # Each launch as if connected: the launch arguments stand in for the saved address, and
          # `-push NO` keeps the question about notifications from covering the screens.
          screen() {
            name=$1
            shift
            step xcrun simctl terminate "$udid" dev.nolune.app || true
            step xcrun simctl launch "$udid" dev.nolune.app -push NO "$@"
            sleep 10
            step xcrun simctl io "$udid" screenshot "$screens/$name.png"
          }
          screen sign-in -origin http://localhost:5780
          screen sidebar -origin http://localhost:5781
          screen chat -origin http://localhost:5781 -open /p/smiths/c/trip
          screen new-chat -origin http://localhost:5781 -open /p/smiths
          screen bell -origin http://localhost:5781 -open '/p/smiths?notification=n2'
          screen memory -origin http://localhost:5781 -open /p/smiths/memory
          screen automations -origin http://localhost:5781 -open /p/smiths/automations
          screen people -origin http://localhost:5781 -open /p/smiths/settings
          screen images -origin http://localhost:5781 -open /p/smiths/images
          screen folder -origin http://localhost:5781 -open /p/smiths/f/japan
          # Today's web app with the note, from a nolune that doesn't say which it is.
          screen update -origin https://www.nolune.dev
          # And without the native screens, a page open.
          screen page -origin https://www.nolune.dev -native NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screens
          path: ${{ runner.temp }}/screens
          retention-days: 14
          if-no-files-found: ignore
