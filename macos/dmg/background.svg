<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
	<!-- The DMG's window (settings.py): nolune and Applications in orbit over a planet's rim, an
	     arrow from one to the other. Finder draws the icons at 128 points with their middles at
	     170, 176 and 490, 176, and their names under them in black in Light Mode and white in Dark
	     Mode, so the names sit on the rim's lit edge, a mid-tone either reads on (about 4.5:1).
	     Rendered with Figtree (../Resources/Fonts) to background.png and background@2x.png. -->
	<defs>
		<radialGradient id="space" cx="0.45" cy="0.25" r="0.95">
			<stop offset="0" stop-color="#141c40" />
			<stop offset="0.55" stop-color="#090c1e" />
			<stop offset="1" stop-color="#04060e" />
		</radialGradient>
		<radialGradient id="glint" r="0.5">
			<stop offset="0" stop-color="#ffffff" stop-opacity="0.45" />
			<stop offset="1" stop-color="#ffffff" stop-opacity="0" />
		</radialGradient>
		<!-- The planet: lit at the rim, into the night side. -->
		<radialGradient id="surface" gradientUnits="userSpaceOnUse" cx="330" cy="1722" r="1500">
			<stop offset="0.9133" stop-color="#070914" />
			<stop offset="0.9533" stop-color="#1c1e42" />
			<stop offset="0.9787" stop-color="#6a6cb0" />
			<stop offset="0.9960" stop-color="#7d7fc0" />
			<stop offset="1" stop-color="#a6a4e4" />
		</radialGradient>
		<!-- Its air, in three of the avatar colors, as the app icon's aurora: campfire, probe, planet. -->
		<linearGradient id="air" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="660" y2="0">
			<stop offset="0.05" stop-color="#fe9042" />
			<stop offset="0.5" stop-color="#70e0c4" />
			<stop offset="0.95" stop-color="#a293fd" />
		</linearGradient>
		<linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="252" y1="0" x2="408" y2="0">
			<stop offset="0" stop-color="#ffffff" stop-opacity="0" />
			<stop offset="1" stop-color="#ffffff" stop-opacity="0.8" />
		</linearGradient>
		<filter id="cloud" x="-60%" y="-60%" width="220%" height="220%">
			<feGaussianBlur stdDeviation="55" />
		</filter>
		<filter id="glow" filterUnits="userSpaceOnUse" x="-100" y="100" width="860" height="320">
			<feGaussianBlur stdDeviation="12" />
		</filter>
	</defs>

	<rect width="660" height="400" fill="url(#space)" />
	<!-- Faint clouds far behind the stars (IntroSky's nebulae). -->
	<g filter="url(#cloud)">
		<ellipse cx="130" cy="90" rx="180" ry="110" fill="#2a3a8a" opacity="0.4" />
		<ellipse cx="560" cy="120" rx="170" ry="110" fill="#5a2a7a" opacity="0.32" />
		<ellipse cx="360" cy="40" rx="160" ry="80" fill="#1d5a6a" opacity="0.3" />
	</g>
