# Example ~/.nolune/config.toml for a self-hosted Nolune server.
# `nolune onboard` writes the same shape, listening on every interface behind a
# generated auth token; copy this file only when you want to start from a
# hand-edited configuration.

# Where the server listens. This example is reachable from this computer only.
# To reach it from other devices set host = "0.0.0.0", and set auth_token first:
# with an empty token every browser on the network could open your companion.
host = "127.0.0.1"
port = 26559

# API token for automation, the CLI and the desktop app. Empty means no
# authentication at all, which is only acceptable on a loopback host.
# Browsers never use it: they pair with a one-time code from `nolune pair`.
auth_token = ""

# Public URL of this server. Defaults to http://localhost:<port>; set it when you
# reach Nolune through another address so shared file links work.
public_url = ""

# Path to pre-built client files (leave empty to serve the embedded web client)
static_dir = ""

[llm]
# Model presets (#156): name the models you want, then pick which preset
# handles conversations and which does background work (memory extraction,
# chat titles, check-ins, reflection).
chat_preset = "sonnet"
background_preset = "haiku"

[[llm.presets]]
id = "sonnet"
name = "Claude Sonnet"
provider = "anthropic"
model = "claude-sonnet-4-6"

[[llm.presets]]
id = "opus"
name = "Claude Opus"
provider = "anthropic"
model = "claude-opus-4-6"

[[llm.presets]]
id = "haiku"
name = "Claude Haiku"
provider = "anthropic"
model = "claude-haiku-4-5-20251001"

# An OpenAI preset works the same way once OPEN_AI is set:
# [[llm.presets]]
# id = "gpt-sol"
# name = "GPT-5.6 Sol"
# provider = "openai"
# model = "gpt-5.6-sol"

[llm.tokens]
ANTHROPIC = ""       # Required for anthropic presets — https://console.anthropic.com
OPEN_AI = ""         # OpenAI presets and text embeddings for memory search
ELEVENLABS = ""      # Optional — text-to-speech
BRAVE_SEARCH = ""    # Optional — Brave Search API key
OPENROUTER = ""      # Optional — OpenRouter API key

# Optional: set FAL_KEY env var for AI image generation via fal.ai MCP

# Email accounts (SMTP/IMAP) are added under Settings → Advanced and stored next
# to the companion, not here.

# Text embeddings are independent of the chat presets and reuse OPEN_AI above.
# Restart after changing this section or the OpenAI key. Missing/disabled/unavailable
# embeddings use BM25; memory writes and generic media attachments keep working.
# Raw media is not embedded until description/transcript support is implemented.
[embedding]
version = 1
enabled = true
provider = "openai"
model = "text-embedding-3-small"
dimensions = 768
base_url = "https://api.openai.com/v1"
# The embedding config API replaces this whole section; omitted fields reset to defaults.
# For local development only, set provider = "openai_compatible" and use an HTTP(S)
# localhost, 127/8, or ::1 endpoint. Compatible endpoints are always unauthenticated:
# OPEN_AI is never sent to them. Remote, private-network, link-local, metadata, userinfo,
# query, and fragment URLs are rejected. No OpenRouter or remote custom provider support
# is implied, and no custom endpoint credential exists in this release.

# MCP servers are usually added under Settings → Capabilities; each entry here
# has the same fields. Custom entries grant no tools until enabled_tools names them.
# [[mcp_servers]]
# name = "excalidraw"
# url = "https://mcp.excalidraw.com/mcp"
# trust = "custom"
# enabled_tools = []
